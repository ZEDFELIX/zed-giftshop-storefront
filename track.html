<!doctype html>
<html lang="en-KE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5c3a">
<title>Track Your Order | ZED Gift Shop</title>
<meta name="description" content="Track a ZED Gift Shop order with your order number and phone or email.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://zedfelix.github.io/zed-giftshop-storefront/track.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZED Gift Shop">
<meta property="og:title" content="Track Your Order | ZED Gift Shop">
<meta property="og:description" content="Track a ZED Gift Shop order with your order number and phone or email.">
<meta property="og:url" content="https://zedfelix.github.io/zed-giftshop-storefront/track.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d5c3a'/%3E%3Ctext x='32' y='45' font-family='Inter,sans-serif' font-size='34' font-weight='900' fill='%23fff' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="zed.css">

</head>
<body>

<a class="skip" href="#main">Skip to content</a>
<header id="siteHeader"></header>

<main id="main">
<nav class="wrap crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Track Order</span></nav>
<section class="wrap sec sec--tight" style="padding-bottom:0">
  <div class="sec__hd">
    <div>
      <p class="hero__kicker" style="color:var(--green)">Order tracking</p>
      <h1 class="ttl" style="font-size:clamp(24px,3vw,34px)">Where is my order?</h1>
      <p style="margin-top:10px;color:var(--muted);font-size:15px;max-width:62ch">Enter your order number with the phone number or email you used at checkout.</p>
    </div>
  </div>
</section>
<section class="wrap sec sec--tight" style="padding-top:0">
  <form class="cartsummary" id="trackForm" style="position:static;max-width:640px" novalidate>
    <h2 class="ttl" style="font-size:18px;margin-bottom:14px">Find your order</h2>
    <div class="field" style="margin-bottom:12px">
      <label for="tNum">Order number</label>
      <input class="input" id="tNum" name="num" placeholder="ZED-2026-482913" required autocomplete="off">
    </div>
    <div class="field" style="margin-bottom:14px">
      <label for="tContact">Phone number or email</label>
      <input class="input" id="tContact" name="contact" placeholder="07xx xxx xxx" autocomplete="off">
      <span class="hint">Optional here, but it is how we confirm an order belongs to you.</span>
    </div>
    <p class="err--box" id="trackErr" hidden></p>
    <button class="btn btn--primary btn--full" type="submit">Track order</button>
  </form>
</section>
<section class="wrap" id="trackOut"></section>
<section class="wrap sec">
  <div class="sec__hd"><h2 class="ttl">Your recent orders</h2></div>
  <div id="recentOrders" class="grid-2"></div>
</section>
</main>

<footer id="siteFooter"></footer>

<div class="modal" id="qv" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Product quick view">
  <div class="modal__v" data-x></div>
  <div class="modal__b">
    <button class="xbtn modal__x" type="button" data-x aria-label="Close quick view">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div id="qvBody"></div>
  </div>
</div>

<script src="store.js" defer></script>
<script src="track.js" defer></script>
</body>
</html>
